name: Android UI Preview

on:
  push:
    branches: ["refactor/product-reset-ui"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-ui-verification-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  rebuilt-screenshots:
    name: Capture rebuilt app screens
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v6

      - name: Download debug APK
        uses: actions/download-artifact@v5
        with:
          name: ledgerlens-debug-apk-${{ github.sha }}
          path: preview-apk

      - name: Capture Overview, Activity, Review, and Insights
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            mkdir -p screenshots/rebuilt
            adb install -r preview-apk/app-debug.apk
            adb shell am force-stop com.example.ledgerlens
            adb shell monkey -p com.example.ledgerlens -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > screenshots/rebuilt/01-overview.png
            adb shell input tap 405 2220
            sleep 2
            adb exec-out screencap -p > screenshots/rebuilt/02-activity.png
            adb shell input tap 675 2220
            sleep 2
            adb exec-out screencap -p > screenshots/rebuilt/03-review.png
            adb shell input tap 945 2220
            sleep 2
            adb exec-out screencap -p > screenshots/rebuilt/04-insights.png

      - name: Upload rebuilt screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-rebuilt-screenshots-${{ github.sha }}
          path: screenshots/rebuilt/*.png
          if-no-files-found: error
          retention-days: 30

  baseline-screenshot:
    name: Capture frozen prototype baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out pre-rebuild baseline
        uses: actions/checkout@v6
        with:
          ref: 7d9c2fb2ba1d9800202597647f5b6d554fa8f003

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build baseline APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Capture baseline launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            mkdir -p screenshots/baseline
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.example.ledgerlens
            adb shell monkey -p com.example.ledgerlens -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > screenshots/baseline/00-prototype-baseline.png

      - name: Upload baseline screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-prototype-baseline-${{ github.sha }}
          path: screenshots/baseline/*.png
          if-no-files-found: error
          retention-days: 30
