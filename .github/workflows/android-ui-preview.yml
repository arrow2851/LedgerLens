name: Android UI Preview

on:
  push:
    branches: ["refactor/product-reset-ui"]
  pull_request:
    branches: ["refactor/product-reset"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build stable-signed preview APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify preview signing identity
        run: ./gradlew signingReport

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-preview-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-ui-verification-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  baseline-apk:
    name: Build frozen prototype baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pre-rebuild baseline
        uses: actions/checkout@v6
        with:
          ref: 7d9c2fb2ba1d9800202597647f5b6d554fa8f003

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build baseline APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-baseline-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  screenshots:
    name: Capture baseline and rebuilt screens
    needs: [build, baseline-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v6

      - name: Download rebuilt APK
        uses: actions/download-artifact@v5
        with:
          name: ledgerlens-preview-apk-${{ github.sha }}
          path: preview-apk

      - name: Download baseline APK
        uses: actions/download-artifact@v5
        with:
          name: ledgerlens-baseline-apk-${{ github.sha }}
          path: baseline-apk

      - name: Capture baseline, Overview, Activity, Review, and Insights
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euxo pipefail
            mkdir -p screenshots

            adb install -r baseline-apk/app-debug.apk
            adb shell am force-stop com.example.ledgerlens
            adb shell monkey -p com.example.ledgerlens -c android.intent.category.LAUNCHER 1
            sleep 4
            adb exec-out screencap -p > screenshots/00-prototype-baseline.png
            adb uninstall com.example.ledgerlens

            adb install -r preview-apk/app-debug.apk
            adb shell am start -W -n com.example.ledgerlens.preview/com.example.ledgerlens.PreviewSeedActivity
            sleep 5

            SIZE=$(adb shell wm size | awk -F: '/Physical size/ {gsub(/\r/, "", $2); gsub(/ /, "", $2); print $2}')
            WIDTH=${SIZE%x*}
            HEIGHT=${SIZE#*x}
            TAP_Y=$((HEIGHT - 120))

            adb exec-out screencap -p > screenshots/01-overview.png
            adb shell input tap $((WIDTH * 3 / 8)) "$TAP_Y"
            sleep 2
            adb exec-out screencap -p > screenshots/02-activity.png
            adb shell input tap $((WIDTH * 5 / 8)) "$TAP_Y"
            sleep 2
            adb exec-out screencap -p > screenshots/03-review.png
            adb shell input tap $((WIDTH * 7 / 8)) "$TAP_Y"
            sleep 2
            adb exec-out screencap -p > screenshots/04-insights.png

      - name: Upload screenshot set
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-ui-screenshots-${{ github.sha }}
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30
