name: Android unit tests

on:
  pull_request:
    branches:
      - feat/improvements
  push:
    branches:
      - sandbox/parser-rule-dry-run

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log

      - name: Retain test reports and parser source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-unit-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            unit-test.log
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/src/main/java/com/example/ledgerlens/domain/parser

      - name: Fail when unit tests fail
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1
