name: LedgerLens2 Android APK
on:
  push:
    branches:
      - feat/LedgerLens2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, assemble
        run: |
          chmod +x gradlew
          ./gradlew :ledgerlens2:testDebugUnitTest :ledgerlens2:lintDebug :ledgerlens2:assembleDebug --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLens2-preview1-debug-apk
          path: ledgerlens2/build/outputs/apk/debug/ledgerlens2-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLens2-build-diagnostics
          path: |
            ledgerlens2/build/test-results/testDebugUnitTest
            ledgerlens2/build/reports/tests/testDebugUnitTest
            ledgerlens2/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
