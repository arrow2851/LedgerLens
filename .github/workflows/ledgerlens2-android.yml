name: LedgerLens2 Android APK
on:
  push:
    branches:
      - feat/LedgerLens2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, assemble
        run: |
          chmod +x gradlew
          ./gradlew :ledgerlens2:testDebugUnitTest :ledgerlens2:lintDebug :ledgerlens2:assembleDebug --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLens2-preview1-debug-apk
          path: ledgerlens2/build/outputs/apk/debug/ledgerlens2-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LedgerLens2-build-diagnostics
          path: |
            ledgerlens2/build/test-results/testDebugUnitTest
            ledgerlens2/build/reports/tests/testDebugUnitTest
            ledgerlens2/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
