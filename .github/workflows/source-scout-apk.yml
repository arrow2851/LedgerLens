name: Build Source Scout APK
on:
  push:
    branches:
      - build/source-scout-2026-10-11
      - build/source-scout-raw-export-2026-10-11
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          curl --fail --location --retry 3 --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "$RUNNER_TEMP/android-cli.zip"
          mkdir -p "$RUNNER_TEMP/android-cli" "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p scout :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LedgerLens-Source-Scout-raw-export-apk
          path: scout/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
