<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerLens Transaction Automation Lab</title>
<style>
:root{color-scheme:dark;--bg:#07100f;--panel:#0e1a18;--panel2:#132320;--line:#263c37;--text:#eef8f5;--muted:#9eb6af;--good:#6ee7b7;--blue:#7dd3fc;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(110,231,183,.14),transparent 30%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.brand{display:flex;gap:14px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(110,231,183,.25),rgba(125,211,252,.12));border:1px solid rgba(110,231,183,.35);font-size:22px}h1{margin:0;font-size:clamp(26px,4vw,42px);letter-spacing:-.04em}.sub{color:var(--muted);max-width:760px;margin-top:4px}.privacy{white-space:nowrap;color:var(--good);border:1px solid rgba(110,231,183,.3);background:rgba(110,231,183,.07);padding:8px 12px;border-radius:999px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab,.btn,input,select{font:inherit;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:9px 12px}.tab,.btn{cursor:pointer}.tab.active,.btn.primary{background:var(--good);color:#042019;border-color:var(--good);font-weight:750}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(19,35,32,.95),rgba(14,26,24,.98));border:1px solid var(--line);border-radius:18px}.metric,.panel{padding:18px}.eyebrow{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:700}.value{font-size:34px;font-weight:850;letter-spacing:-.05em;margin:6px 0}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.two{grid-template-columns:1.45fr .75fr}.section{display:none}.section.active{display:block}.bar{display:grid;grid-template-columns:190px 1fr 72px;gap:12px;align-items:center;margin:13px 0}.track{height:10px;background:#07110f;border:1px solid #18302a;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--good),var(--blue))}.callout{border:1px solid rgba(125,211,252,.25);background:rgba(125,211,252,.07);padding:14px;border-radius:13px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px}.pill.good{background:rgba(110,231,183,.08)}.pill.warn{background:rgba(251,191,36,.08)}.pill.bad{background:rgba(251,113,133,.08)}.queue{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#091412;cursor:pointer}.item.selected{border-color:var(--good);background:rgba(110,231,183,.06)}.head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.editor{display:grid;gap:10px}.editor label{display:grid;gap:5px;color:var(--muted)}.table{overflow:auto;border:1px solid var(--line);border-radius:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{min-width:240px;flex:1}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px 12px;border-bottom:1px solid #1a302b;text-align:left;vertical-align:top}th{background:#14241f;color:#bdd2cc;font-size:11px;text-transform:uppercase;letter-spacing:.07em}.changed td:first-child{box-shadow:inset 3px 0 var(--good)}pre{white-space:pre-wrap;background:#07110f;border:1px solid #1c302b;border-radius:12px;padding:12px}.footer{text-align:center;color:var(--muted);padding:26px 0 4px}.toast{position:fixed;right:22px;bottom:22px;padding:11px 14px;border-radius:12px;background:#17362e;border:1px solid #2b5f50;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){header{flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:560px){.shell{padding:14px}.metrics{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 55px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo">◫</div><div><h1>LedgerLens Automation Lab</h1><div class="sub">Sanitized public demo. Aggregate results come from the full 456-row private dry run; all interactive transaction rows below are synthetic.</div></div></div><div class="privacy">● Synthetic rows only</div></header>
<nav class="tabs" id="tabs"></nav>
<main><section id="overview" class="section active"></section><section id="queue" class="section"></section><section id="transactions" class="section"></section><section id="tests" class="section"></section></main>
<div class="footer">No network requests · no raw SMS or personal transaction records</div>
</div><div class="toast" id="toast"></div>
<script>
const aggregate={before:{review:38,uncategorized:80},after:{review:18,uncategorized:54,groups:13,ignored:3,duplicates:15},reduction:{review:20,categories:26},tests:90};
const rows=[
{id:1001,date:'2026-06-10',amount:62.54,source:'Example Bank',pattern:'external_transfer',key:'EXAMPLE TELECOM',before:{merchant:'Example Telecom',category:null,treatment:'POSSIBLE_PAYMENT_TRANSFER',review:'NEEDS_REVIEW',impact:62.54},after:{merchant:'Example Telecom',category:'Utilities',treatment:'EXPENSE',review:'REVIEWED',impact:62.54},reason:'Complete learned decision applied'},
{id:1002,date:'2026-05-10',amount:62.54,source:'Example Bank',pattern:'external_transfer',key:'EXAMPLE TELECOM',before:{merchant:'Example Telecom',category:null,treatment:'POSSIBLE_PAYMENT_TRANSFER',review:'NEEDS_REVIEW',impact:62.54},after:{merchant:'Example Telecom',category:'Utilities',treatment:'EXPENSE',review:'REVIEWED',impact:62.54},reason:'Complete learned decision applied'},
{id:1010,date:'2026-06-05',amount:60,source:'Example Bank',pattern:'p2p_incoming',key:'EXAMPLE PERSON|6000',before:{merchant:'Example Person',category:null,treatment:'INCOME',review:'NEEDS_REVIEW',impact:0},after:{merchant:'Example Person',category:'Utilities',treatment:'REIMBURSEMENT',review:'REVIEWED',impact:-60},reason:'Amount-scoped reimbursement rule'},
{id:1011,date:'2026-05-05',amount:100,source:'Example Bank',pattern:'p2p_incoming',key:'EXAMPLE PERSON|10000',before:{merchant:'Example Person',category:null,treatment:'INCOME',review:'NEEDS_REVIEW',impact:0},after:{merchant:'Example Person',category:null,treatment:'INCOME',review:'NEEDS_REVIEW',impact:0},reason:'Different amount remains for review'},
{id:1020,date:'2026-06-03',amount:10.83,source:'Example Card',pattern:'generic_fallback',key:'MISSING MERCHANT',authorized:'Example User',before:{merchant:"Example User's Venture Credit Card (1234)",category:'Groceries',treatment:'EXPENSE',review:'AUTO_PARSED',impact:10.83},after:{merchant:null,category:'Groceries',treatment:'EXPENSE',review:'NEEDS_REVIEW',impact:10.83},reason:'Cardholder/card-product label rejected as merchant'},
{id:1030,date:'2026-06-02',amount:3200,source:'Example Card',pattern:'generic_fallback',key:'ALERT THRESHOLD',ignored:true,before:{merchant:'Alert settings threshold',category:null,treatment:'UNKNOWN',review:'NEEDS_REVIEW',impact:3200},after:{merchant:null,category:null,treatment:'UNKNOWN',review:'IGNORED_NON_TRANSACTION',impact:0},reason:'Informational threshold alert suppressed'},
{id:1040,date:'2026-06-01',amount:25.40,source:'Example Card',pattern:'card_purchase',key:'EXAMPLE CAFE',before:{merchant:'TST*EXAMPLE CAFE',category:null,treatment:'EXPENSE',review:'AUTO_PARSED',impact:25.40},after:{merchant:'TST*EXAMPLE CAFE',category:'Dining & Restaurants',treatment:'EXPENSE',review:'AUTO_PARSED',impact:25.40},reason:'Canonical merchant category memory'},
{id:1050,date:'2026-05-28',amount:500,source:'Example Bank',pattern:'external_transfer',key:'EXAMPLE CARD ISSUER',before:{merchant:'Example Card Issuer',category:'Card Payments',treatment:'TRANSFER',review:'REVIEWED',impact:0},after:{merchant:'Example Card Issuer',category:'Card Payments',treatment:'TRANSFER',review:'NEEDS_REVIEW',impact:0},reason:'Conflicting prior decisions blocked'},
{id:1051,date:'2026-05-15',amount:450,source:'Example Bank',pattern:'external_transfer',key:'EXAMPLE CARD ISSUER',before:{merchant:'Example Card Issuer',category:'Card Payments',treatment:'CREDIT_CARD_PAYMENT',review:'REVIEWED',impact:0},after:{merchant:'Example Card Issuer',category:'Card Payments',treatment:'CREDIT_CARD_PAYMENT',review:'NEEDS_REVIEW',impact:0},reason:'Conflicting prior decisions blocked'},
{id:1060,date:'2026-05-20',amount:42,source:'Example Card',pattern:'card_purchase',key:'EXAMPLE MARKET',duplicate:true,before:{merchant:'Example Market',category:'Groceries',treatment:'EXPENSE',review:'AUTO_PARSED',impact:42},after:{merchant:'Example Market',category:'Groceries',treatment:'EXPENSE',review:'AUTO_PARSED',impact:42},reason:'Possible duplicate; never auto-deleted'},
{id:1061,date:'2026-05-20',amount:42,source:'Example Card',pattern:'card_purchase',key:'EXAMPLE MARKET',duplicate:true,before:{merchant:'Example Market',category:'Groceries',treatment:'EXPENSE',review:'AUTO_PARSED',impact:42},after:{merchant:'Example Market',category:'Groceries',treatment:'EXPENSE',review:'AUTO_PARSED',impact:42},reason:'Possible duplicate; never auto-deleted'}
];
const state={tab:'overview',mode:'after',query:'',selected:null,rows:structuredClone(rows)};
const tabs=[['overview','Overview'],['queue','Decision queue'],['transactions','Synthetic explorer'],['tests','Verification']];
const $=s=>document.querySelector(s), money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0)), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pill(t,c=''){return `<span class="pill ${c}">${esc(t)}</span>`}function changed(r){return JSON.stringify(r.before)!==JSON.stringify(r.after)||r.ignored||r.authorized}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function renderTabs(){$('#tabs').innerHTML=tabs.map(([id,l])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function metric(label,value,detail,cls=''){return `<article class="card metric"><div class="eyebrow">${label}</div><div class="value ${cls}">${value}</div><div class="muted">${detail}</div></article>`}
function renderOverview(){const a=aggregate;$('#overview').innerHTML=`<div class="grid metrics">${metric('Review queue','38 → 18','20 repeated reviews removed','good')}${metric('Categories remembered','26','Blank spending categories filled','good')}${metric('False transactions','3 → 0','Threshold alerts suppressed','good')}${metric('Remaining decisions','13 groups','Grouped instead of row-by-row','warn')}</div><div class="grid two" style="margin-top:14px"><article class="card panel"><h2>Manual-work reduction</h2>${bar('Transactions requiring review',38,18,80)}${bar('Uncategorized spending rows',80,54,80)}${bar('User decision groups',38,13,80)}<div class="callout"><strong>Privacy boundary:</strong> the public site contains aggregate measurements and synthetic reproductions only. Raw exports remain local.</div></article><aside class="card panel"><h2>Safety behavior</h2><p>${pill('Auto-applied','good')} ${pill('Needs decision','warn')} ${pill('Conflict blocked','bad')}</p><p class="muted">Authorized-user labels are rejected as merchants, conflicting history is not generalized, and duplicate candidates are never deleted automatically.</p><button class="btn primary" onclick="go('queue')">Try the decision queue</button></aside></div>`}
function bar(l,b,a,m){return `<div class="bar"><div>${l}</div><div class="track"><div class="fill" style="width:${Math.max(4,a/m*100)}%"></div></div><div>${b} → ${a}</div></div>`}
function groups(){const map=new Map;state.rows.filter(r=>!r.ignored&&r.after.review==='NEEDS_REVIEW').forEach(r=>{const k=`${r.source}|${r.pattern}|${r.key}`;if(!map.has(k))map.set(k,[]);map.get(k).push(r)});return [...map].map(([key,items])=>({key,items,title:items[0].after.merchant||items[0].before.merchant||'Merchant missing'}))}
function renderQueue(){const g=groups();if(!state.selected&&g.length)state.selected=g[0].key;const s=g.find(x=>x.key===state.selected)||g[0];$('#queue').innerHTML=`<div class="grid two"><section class="card panel"><h2>Remaining synthetic decisions</h2><p class="muted">Choose a group once; the decision applies to all matching rows.</p><div class="queue">${g.map(x=>`<div class="item ${s?.key===x.key?'selected':''}" data-key="${esc(x.key)}"><div class="head"><strong>${esc(x.title)}</strong>${pill(`${x.items.length} item${x.items.length===1?'':'s'}`,'warn')}</div><div class="muted">${esc(x.items[0].source)} · ${esc(x.items[0].pattern)}</div></div>`).join('')||'<div class="muted">All synthetic groups resolved.</div>'}</div></section><aside class="card panel">${s?editor(s):'<p class="muted">Nothing selected.</p>'}</aside></div>`;document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>{state.selected=e.dataset.key;renderQueue()});const b=$('#apply');if(b)b.onclick=apply}
function editor(g){const r=g.items[0];return `<h2>Teach once</h2><div class="editor"><label>Merchant<input id="merchant" value="${esc(r.after.merchant||'')}"></label><label>Classification<select id="treatment">${['EXPENSE','REIMBURSEMENT','INCOME','TRANSFER','CREDIT_CARD_PAYMENT'].map(v=>`<option ${r.after.treatment===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Category<input id="category" value="${esc(r.after.category||'')}"></label><div class="callout">Classification determines spending inclusion; matching rows become Reviewed.</div><button id="apply" class="btn primary">Apply to ${g.items.length} row${g.items.length===1?'':'s'}</button></div>`}
function apply(){const g=groups().find(x=>x.key===state.selected);if(!g)return;const merchant=$('#merchant').value.trim()||null,t=$('#treatment').value,cat=$('#category').value.trim()||null,excluded=['INCOME','TRANSFER','CREDIT_CARD_PAYMENT'].includes(t);g.items.forEach(r=>{r.after.merchant=merchant;r.after.treatment=t;r.after.category=excluded?null:cat;r.after.review='REVIEWED';r.after.impact=excluded?0:(t==='REIMBURSEMENT'?-Math.abs(r.amount):Math.abs(r.amount));r.reason='Interactive decision applied'});state.selected=null;toast(`Applied one decision to ${g.items.length} row${g.items.length===1?'':'s'}`);render()}
function renderTransactions(){const q=state.query.toLowerCase(),filtered=state.rows.filter(r=>[r.id,r.before.merchant,r.after.merchant,r.after.category,r.after.treatment,r.source,r.reason].join(' ').toLowerCase().includes(q));$('#transactions').innerHTML=`<div class="card panel"><div class="head"><div><h2>Synthetic before/after explorer</h2><p class="muted">No personal records are included.</p></div><div><button class="tab ${state.mode==='before'?'active':''}" data-mode="before">Before</button> <button class="tab ${state.mode==='after'?'active':''}" data-mode="after">After</button></div></div><div class="toolbar"><input id="search" placeholder="Search merchant, treatment, reason…" value="${esc(state.query)}"><button class="btn" id="csv">Export sample CSV</button></div><div class="table"><table><thead><tr><th>Date</th><th>Amount</th><th>Merchant</th><th>Category</th><th>Treatment</th><th>Review</th><th>Impact</th><th>Automation</th></tr></thead><tbody>${filtered.map(renderRow).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;renderTransactions()});$('#search').oninput=e=>{state.query=e.target.value;renderTransactions()};$('#csv').onclick=exportCsv}
function renderRow(r){const c=r[state.mode];return `<tr class="${changed(r)?'changed':''}"><td>${r.date}<div class="muted">#${r.id}</div></td><td>${money(r.amount)}</td><td>${esc(c.merchant||'—')}${r.authorized?`<div>${pill(`Card used by ${r.authorized}`,'warn')}</div>`:''}</td><td>${esc(c.category||'—')}</td><td>${esc(c.treatment)}</td><td>${pill(c.review,c.review==='NEEDS_REVIEW'?'warn':c.review==='IGNORED_NON_TRANSACTION'?'bad':'good')}</td><td>${money(c.impact)}</td><td>${r.duplicate?pill('Possible duplicate','warn'):''}<div class="muted">${esc(r.reason)}</div></td></tr>`}
function exportCsv(){const h=['id','date','amount','merchant','category','treatment','review','impact','reason'],r=state.rows.map(x=>{const c=x[state.mode];return [x.id,x.date,x.amount,c.merchant,c.category,c.treatment,c.review,c.impact,x.reason]});const q=v=>`"${String(v??'').replaceAll('"','""')}"`;const blob=new Blob([[h,...r].map(x=>x.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledgerlens-public-demo.csv';a.click();URL.revokeObjectURL(a.href)}
function renderTests(){$('#tests').innerHTML=`<div class="grid two"><section class="card panel"><h2>Verification</h2>${test('Android JVM suite','90/90 tests passed in GitHub Actions')}${test('Full-export dry run','456 private rows analyzed locally; only aggregates are public')}${test('Alert filtering','3/3 informational threshold records suppressed')}${test('Conflict safety','No rule learned from contradictory treatment history')}</section><aside class="card panel"><h2>Focused public cases</h2><pre>✓ Complete external-payment decision\n✓ Amount-scoped reimbursement\n✓ Authorized user is not merchant\n✓ Alert threshold is not a transaction\n✓ Processor prefix normalization</pre></aside></div>`}function test(n,d){return `<div class="item"><div class="head"><strong>${n}</strong>${pill('PASS','good')}</div><div class="muted">${d}</div></div>`}
function go(t){state.tab=t;render()}function render(){renderTabs();document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===state.tab));if(state.tab==='overview')renderOverview();if(state.tab==='queue')renderQueue();if(state.tab==='transactions')renderTransactions();if(state.tab==='tests')renderTests()}render();
</script>
</body>
</html>
